<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="window" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>
  <!-- Building shape (isometric) -->
  <g transform="translate(96, 120)">
    <!-- Main building body -->
    <path d="M-60,0 L-60,-80 L60,-80 L60,0 Z" fill="url(#building)" stroke="#fff" stroke-width="1" opacity="0.2"/>
    <!-- Roof -->
    <path d="M-70,-80 L0,-110 L70,-80 L-70,-80 Z" fill="#0f3460" stroke="#fff" stroke-width="1" opacity="0.1"/>
    <!-- Windows - left side -->
    <g fill="url(#window)">
      <rect x="-50" y="-70" width="12" height="14" rx="2"/>
      <rect x="-50" y="-50" width="12" height="14" rx="2"/>
      <rect x="-50" y="-30" width="12" height="14" rx="2"/>
      <rect x="-50" y="-10" width="12" height="14" rx="2"/>
      <rect x="-25" y="-70" width="12" height="14" rx="2"/>
      <rect x="-25" y="-50" width="12" height="14" rx="2"/>
      <rect x="-25" y="-30" width="12" height="14" rx="2"/>
      <rect x="-25" y="-10" width="12" height="14" rx="2"/>
    </g>
    <!-- Windows - right side -->
    <g fill="url(#window)">
      <rect x="13" y="-70" width="12" height="14" rx="2"/>
      <rect x="13" y="-50" width="12" height="14" rx="2"/>
      <rect x="13" y="-30" width="12" height="14" rx="2"/>
      <rect x="13" y="-10" width="12" height="14" rx="2"/>
      <rect x="38" y="-70" width="12" height="14" rx="2"/>
      <rect x="38" y="-50" width="12" height="14" rx="2"/>
      <rect x="38" y="-30" width="12" height="14" rx="2"/>
      <rect x="38" y="-10" width="12" height="14" rx="2"/>
    </g>
    <!-- Entrance -->
    <path d="M-10,0 L-10,-30 L10,-30 L10,0 Z" fill="#0f3460"/>
    <rect x="-5" y="-10" width="10" height="10" fill="#e94560" rx="1"/>
  </g>
  <!-- Small plants at base -->
  <g transform="translate(96, 110)" fill="#2ecc71">
    <circle cx="-75" cy="5" r="6"/>
    <circle cx="75" cy="5" r="6"/>
  </g>
</svg>