<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="window" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="84" fill="url(#bg)"/>
  <!-- Building shape (isometric) -->
  <g transform="translate(256, 320)">
    <!-- Main building body -->
    <path d="M-160,0 L-160,-210 L160,-210 L160,0 Z" fill="url(#building)" stroke="#fff" stroke-width="2" opacity="0.2"/>
    <!-- Roof -->
    <path d="M-185,-210 L0,-290 L185,-210 L-185,-210 Z" fill="#0f3460" stroke="#fff" stroke-width="2" opacity="0.1"/>
    <!-- Windows - left side -->
    <g fill="url(#window)">
      <rect x="-135" y="-185" width="32" height="38" rx="6"/>
      <rect x="-135" y="-135" width="32" height="38" rx="6"/>
      <rect x="-135" y="-85" width="32" height="38" rx="6"/>
      <rect x="-135" y="-35" width="32" height="38" rx="6"/>
      <rect x="-68" y="-185" width="32" height="38" rx="6"/>
      <rect x="-68" y="-135" width="32" height="38" rx="6"/>
      <rect x="-68" y="-85" width="32" height="38" rx="6"/>
      <rect x="-68" y="-35" width="32" height="38" rx="6"/>
    </g>
    <!-- Windows - right side -->
    <g fill="url(#window)">
      <rect x="36" y="-185" width="32" height="38" rx="6"/>
      <rect x="36" y="-135" width="32" height="38" rx="6"/>
      <rect x="36" y="-85" width="32" height="38" rx="6"/>
      <rect x="36" y="-35" width="32" height="38" rx="6"/>
      <rect x="103" y="-185" width="32" height="38" rx="6"/>
      <rect x="103" y="-135" width="32" height="38" rx="6"/>
      <rect x="103" y="-85" width="32" height="38" rx="6"/>
      <rect x="103" y="-35" width="32" height="38" rx="6"/>
    </g>
    <!-- Entrance -->
    <path d="M-25,0 L-25,-80 L25,-80 L25,0 Z" fill="#0f3460"/>
    <rect x="-12" y="-28" width="24" height="24" fill="#e94560" rx="3"/>
  </g>
  <!-- Small plants at base -->
  <g transform="translate(256, 300)" fill="#2ecc71">
    <circle cx="-200" cy="10" r="16"/>
    <circle cx="200" cy="10" r="16"/>
  </g>
</svg>